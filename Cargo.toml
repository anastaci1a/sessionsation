[package]
name = "sessionsation"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "CLI-first account and session management for coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true

# Check-suite speed: the tests hash and exercise the (debug) binary and bundled
# SQLite many times, which is far slower unoptimized. Dependencies are built once
# per target dir; the crate itself keeps fast incremental debug builds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
