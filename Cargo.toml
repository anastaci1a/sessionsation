[package]
name = "sessionsation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "CLI-first account and session management for coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
portable-pty = "0.9"
vt100 = "0.15"

[profile.release]
lto = "thin"
strip = true
